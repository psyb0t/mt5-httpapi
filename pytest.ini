[pytest]
# `tests/integration/` spawns sibling containers through the host docker socket
# (testcontainers), so it is NOT collected by the default run — `make test`
# executes inside an offline image with no docker access. `make test-integration`
# runs it on the host.
testpaths = tests
norecursedirs = tests/real tests/integration

markers =
    integration: spins up real containers via testcontainers; needs a docker socket
