name: pipeline

# mt5-httpapi ships as a docker-compose / Windows-VM stack, not a single
# pushable image, so there's no docker-image build in CI. Beyond running the
# test suite, this pipeline publishes the skill(s) under .agents/skills/ to
# ClawHub on tag pushes.
on:
  # Every branch and every tag: the mirror job below has to see all of them, and
  # narrowing this to master would silently drop the rest. The build jobs carry
  # their own ref guards so their CI cost is unchanged.
  push:
  # Staggered per repository. The Wayback Machine is rate-limited and one save
  # takes ~110s, so a shared cron would have every repo throttling the rest.
  schedule:
    - cron: "7 7 12 * *"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  # Keep the caller's group distinct from groups inside reusable workflows.
  # Identical groups deadlock when this workflow waits for a called workflow.
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `make test` is the full automated suite: offline unit/contract tests plus
  # the container-backed nginx and MCP-unifier tests. It is NOT the
  # python-package-workflow caller: that pipeline expects a dist/, and this
  # repo builds no package.
  test:
    # `on: push` is now every branch, so this spells out what the trigger used
    # to: master and tags only, or a non-draft PR. A feature branch with an open
    # PR would otherwise run the suite twice for the same commit.
    if: >-
      (github.event_name == 'push' &&
       (github.ref_name == github.event.repository.default_branch ||
        startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run the test suite
        run: make test

  # Shell + PowerShell linting (shellcheck / shfmt / PSScriptAnalyzer). This was
  # never wired into CI, so master reached a shfmt-dirty state without anything
  # noticing.
  lint:
    if: >-
      (github.event_name == 'push' &&
       (github.ref_name == github.event.repository.default_branch ||
        startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Lint
        run: make lint

  badges:
    if: github.event_name != 'schedule' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # Publish the skills under .agents/skills/ to ClawHub, one ClawHub slug per
  # subdir. The `if` is load-bearing: the workflow also runs on branch pushes
  # and pull requests now, and without it every one of those would publish.
  # Gated on the suite so a tag with failing tests never reaches ClawHub.
  publish-skills-to-clawhub:
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master

    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  # Every branch and every tag, which is why it carries no ref filter: a mirror
  # that only saw the default branch would silently drop the rest.
  mirror:
    if: github.event_name == 'push'
    uses: psyb0t/reusable-github-workflows/.github/workflows/git-mirror.yml@master
    with:
      gitlab_enabled: true
      # Gitee is off: it requires a mobile number bound to the account before
      # any repository can be public, and rather than refusing it creates the
      # repo private, so the mirror runs green while nobody can see it. Turn it
      # back on once the account is verified.
      gitee_enabled: false
    secrets:
      gitlab_token: ${{ secrets.GITLAB_TOKEN }}

  # Runs on the monthly cron, on a manual dispatch, and on a push to the default
  # branch or a tag. Spelled out positively rather than as `!= 'push'` because
  # this workflow also fires on pull_request, and a rate-limited archive has no
  # business running once per PR synchronize.
  archive:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref_name == github.event.repository.default_branch ||
        startsWith(github.ref, 'refs/tags/')))
    uses: psyb0t/reusable-github-workflows/.github/workflows/archive.yml@master
    with:
      # Off because no archive.org keys are set on this repo. Outlink capture
      # only works on the authenticated Save Page Now API; on the keyless path
      # the flag is silently ignored, so leaving it on would just log a warning
      # every run. Add wayback_access_key / wayback_secret_key and flip this to
      # true to sweep in every page the README links to.
      capture_outlinks: false
