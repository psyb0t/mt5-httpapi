vms:
  - name: fast
    service: mt5
    container_name: mt5
    cpuset: "0-19,40-59"
    ram: "112G"
    cpu_cores: 40
    disk_size: "300G"
    storage: /data/mt5-vm-a/storage
    hot_tier: /mnt/mt5-hot
    log_dir: /data/mt5-shared/logs
    novnc_port: 8006
    wickworks_service: wickworks
    mem_limit: 116G
    memswap_limit: 120G
    extra_binds:
      - /mnt/mt5-hot/terminals/darwinex/live/a:/shared/terminals/darwinex/live/a
      - /mnt/mt5-hot/terminals/darwinex/live/b:/shared/terminals/darwinex/live/b
      - /mnt/mt5-hot/terminals/darwinex/live/c:/shared/terminals/darwinex/live/c
      - /mnt/mt5-hot/terminals/darwinex/live/d:/shared/terminals/darwinex/live/d
      - /mnt/mt5-hot/terminals/darwinex/live/e:/shared/terminals/darwinex/live/e
      - /mnt/mt5-hot/terminals/darwinex/live/f:/shared/terminals/darwinex/live/f
      - /mnt/mt5-hot/terminals/darwinex/live/g:/shared/terminals/darwinex/live/g
      - /mnt/mt5-hot/terminals/darwinex/live/h:/shared/terminals/darwinex/live/h
      - /mnt/mt5-hot/terminals/darwinex/live/i:/shared/terminals/darwinex/live/i
      - /mnt/mt5-hot/terminals/darwinex/live/j:/shared/terminals/darwinex/live/j
      - /mnt/mt5-hot/terminals/darwinex/live/k:/shared/terminals/darwinex/live/k

  - name: bulk
    service: mt5-b
    container_name: mt5-b
    cpuset: "20-39,60-79"
    ram: "112G"
    cpu_cores: 40
    disk_size: "150G"
    storage: /data/mt5-vm-b/storage
    hot_tier: /mnt/mt5-hot-b
    log_dir: /data/mt5-vm-b/logs
    novnc_port: 8007
    wickworks_service: wickworks-b
    mem_limit: 116G
    memswap_limit: 120G
    extra_binds:
      - /mnt/mt5-hot-b/terminals/darwinex/live/l:/shared/terminals/darwinex/live/l
      - /mnt/mt5-hot-b/terminals/darwinex/live/m:/shared/terminals/darwinex/live/m
